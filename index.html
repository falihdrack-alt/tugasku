<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskKu Kuliah</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">
    <div class="max-w-md mx-auto bg-slate-800 rounded-xl shadow-lg p-6 border border-slate-700">
        <h1 class="text-2xl font-bold mb-4 text-emerald-400">📝 Tugas Kuliah-ku</h1>
        
        <!-- Form Tambah Tugas -->
        <div class="flex gap-2 mb-6">
            <input type="text" id="taskInput" placeholder="Tulis nama tugas baru..." 
                class="flex-1 bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-emerald-500">
            <button onclick="addTask()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg font-semibold transition">Tambah</button>
        </div>

        <!-- List Tugas -->
        <ul id="taskList" class="space-y-3">
            <!-- Data tugas muncul di sini -->
        </ul>
    </div>

    <script>
        let tasks = JSON.parse(localStorage.getItem('my_tasks')) || [
            { text: "Makalah PTI: AI untuk Kemajuan Peradaban (Min 10 Halaman)", completed: false }
        ];

        function renderTasks() {
            const listEl = document.getElementById('taskList');
            listEl.innerHTML = '';
            tasks.forEach((task, index) => {
                listEl.innerHTML += `
                    <li class="flex items-center justify-between bg-slate-700/50 p-3 rounded-lg border border-slate-600/50">
                        <span class="${task.completed ? 'line-through text-slate-400' : 'text-slate-200'} flex-1 mr-2">${task.text}</span>
                        <button onclick="toggleTask(${index})" class="w-8 h-8 rounded-full border-2 ${task.completed ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-400 hover:border-emerald-400'} flex items-center justify-center transition">
                            ${task.completed ? '✓' : ''}
                        </button>
                    </li>
                `;
            });
            localStorage.setItem('my_tasks', JSON.stringify(tasks));
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            if (input.value.trim() === '') return;
            tasks.push({ text: input.value, completed: false });
            input.value = '';
            renderTasks();
        }

        function toggleTask(index) {
            tasks[index].completed = !tasks[index].completed;
            renderTasks();
        }

        renderTasks();
    </script>
</body>
</html>
